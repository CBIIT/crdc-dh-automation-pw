[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crdc-dh-automation-pw"
version = "0.1.0"
description = "Playwright Python test framework for CRDC Data Hub (Katalon port)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "pytest>=8.0",
    "pytest-playwright>=0.6",
    "pytest-html>=4.0",
    "pyyaml>=6.0",
    "pyotp>=2.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["crdc_pw"]
ignore_missing_imports = true
