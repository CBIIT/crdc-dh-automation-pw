[pytest]
# log_cli prints Login/Assert/PASS lines during smoke. -ra shows skip reasons.
testpaths = tests
markers =
    smoke: live Hub smoke (needs config/<profile>.yaml credentials)
    unit: no browser
addopts = -ra --tb=short
log_cli = true
log_cli_level = INFO
log_cli_format = %(message)s
filterwarnings =
    ignore::DeprecationWarning
