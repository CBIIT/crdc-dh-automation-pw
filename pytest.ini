[pytest]
# log_cli prints Login/Assert/PASS lines during live runs. -ra shows skip reasons.
# Suite markers match Katalon Test Suites/CRDC_*.ts. A case can have more than one
# (TC08 is CRDC_Auxiliary and CRDC_Smoke). Do not mark every live test as CRDC_Smoke.
testpaths = tests
markers =
    unit: no browser
    CRDC_Auxiliary: Katalon CRDC_Auxiliary
    CRDC_PBAC: Katalon CRDC_PBAC
    CRDC_Smoke: Katalon CRDC_Smoke (subset; not every live test)
    CRDC_Regression: Katalon CRDC_Regression
    CRDC_SubmissionRequests: Katalon CRDC_SubmissionRequests
    CRDC_DSFlow: Katalon CRDC_DSFlow
    CRDC_EmailNotifications: Katalon CRDC_EmailNotifications
    CRDC_DataValidation: Katalon CRDC_DataValidation
    CRDC_DataValidation_Excel: Excel-driven metadata VR (tests/DataValidation)
    CRDC_DataFileUpload: Katalon CRDC_DataFileUpload
    CRDC_API: Katalon CRDC_API
    CRDC_ICDCSuite: Katalon CRDC_ICDCSuite
    CRDC_CTDCSuite: Katalon CRDC_CTDCSuite
    CRDC_NotCompatibleOnJenkins: Katalon CRDC_NotCompatibleOnJenkins
    CRDC_DebugSuite: Katalon CRDC_DebugSuite
# Do not put -n here. Parallel is opt-in: pytest -m CRDC_Smoke -n 4
addopts = -ra --tb=short --strict-markers --tracing=retain-on-failure
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(message)s
log_cli_date_format = %H:%M:%S
