# CRDC/AILocators/GenericTable/Pagination

# Active page number button (aria-current, or the Mui-selected class on older markup).
CurrentPage-Btn: "//nav[contains(@aria-label,'pagination actions')]//button[@aria-current='true' or contains(@class,'Mui-selected')]"
# Page number button; fill ${page} (for example 2 gives aria-label 'Go to page 2').
GoToPage-Btn: "//button[@aria-label='Go to page ${page}']"
# Every button in the pagination nav; numeric text gives the page numbers.
PaginationNav-Buttons: "//nav[contains(@aria-label,'pagination actions')]//button"
DisplayedRows-Lbl: "//div[contains(@class,'MuiTablePagination-toolbar')]//p[contains(@class,'MuiTablePagination-displayedRows')]"
NextPage-Btn: "//button[@aria-label='Go to next page']"
PaginationActions-Container: "//nav[@aria-label='bottom pagination actions']"
PaginationToolbar-Container: "//div[contains(@class,'MuiTablePagination-toolbar')]"
PreviousPage-Btn: "//button[@aria-label='Go to previous page']"
RowsPerPage-Ddn: "//*[@data-testid='generic-table-rows-per-page-bottom']"
# Pagination displayed-rows text (e.g. "1–20 of 193") used to read total table entry count.
TablePagination-DisplayedRows: "//*[contains(@class,'TablePagination-displayedRows')]"
